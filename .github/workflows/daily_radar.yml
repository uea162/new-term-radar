name: Daily New Term Radar

on:
  schedule:
    # 每天 UTC 时间 0:00 运行（即北京时间每天早上 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你随时在网页上手动点击运行测试

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Main Script
        env:
          # 如果你需要用到你在 Settings 里配置的密钥，在这里关联
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 请根据原项目实际的主程序文件名修改（比如 main.py 或 run.py）
          python main.py
